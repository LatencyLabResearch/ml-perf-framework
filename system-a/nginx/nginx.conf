events {
    worker_connections 1024;
}

http {

    # ── Backend instance pool ──────────────────────────
    upstream backend_pool {
        # Round robin is nginx default — matches your current roundRobin.js
        server localhost:3001;
        server localhost:3002;
        server localhost:3003;

        # Keep connections alive to backend instances
        # This directly fixes your Windows port exhaustion issue
        keepalive 32;
    }

    server {
        listen 3000;

        # ── Keep-alive to k6 (fixes port exhaustion) ──
        keepalive_timeout      65s;
        keepalive_requests     10000;

        # ── Timeouts matching your current lb.js ──────
        proxy_connect_timeout  10s;
        proxy_send_timeout     10s;
        proxy_read_timeout     10s;

        # ── Required for keepalive upstream to work ───
        proxy_http_version     1.1;
        proxy_set_header       Connection "";

        # ── Forward all headers your middleware reads ──
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;

        # ── Your experiment headers (metricCollector.js reads these) ──
        proxy_pass_request_headers on;

        # ── Health check (replaces /lb-health in lb.js) ───────────
        location /lb-health {
            access_log off;
            return 200 '{"status":"ok","lb":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── API endpoints ──────────────────────────────
        location /api/light {
            proxy_pass http://backend_pool;
        }

        location /api/moderate {
            proxy_pass http://backend_pool;
        }

        # Heavy endpoint — longer read timeout
        # fib(40) can take several seconds
        location /api/heavy {
            proxy_pass         http://backend_pool;
            proxy_read_timeout 30s;
        }

        # ── Instance health checks ─────────────────────
        location /health {
            proxy_pass http://backend_pool;
        }

        # ── 502/504 error handling ─────────────────────
        # Replaces your proxy.on('error') handler in lb.js
        error_page 502 503 504 /gateway_error;
        location = /gateway_error {
            internal;
            return 502 '{"error":"Bad Gateway"}';
            add_header Content-Type application/json;
        }
    }
}